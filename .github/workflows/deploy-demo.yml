name: Deploy public demo

# Publishes the public demo site to GitHub Pages: a static landing page
# (apps/demo-landing) at the site root, the read-only Studio
# (apps/webgpu-spike) under /studio/, and committed evidence screenshots the
# landing cards reference under /media/. Digital Hub (MIT-licensed IFC-Bench
# federation) is the Studio's default scene; PyGamer (MIT-licensed STEP
# fixture, already committed under artifacts/phase1/adafruit-pygamer/) is
# reachable as a secondary example via studio/?scene=pygamer/scene.gltf.
#
# Digital Hub's compiled package (~63 MB) is not committed, per AGENTS.md's
# rule against large derived geometry in git history. Where it is served from
# depends on the repository variable NARU_PACKAGE_ORIGIN (ADR-0023):
#
#   unset - the package is downloaded from the GitHub Release asset (tag
#           demo-digital-hub-v1) and copied into the Pages site artifact, so
#           the Studio opens it site-relative. This is the historical path and
#           it is bounded by the 1 GB Pages site limit.
#   set   - the package is already published under that HTTPS prefix (an
#           object store meeting the ADR-0023 delivery contract) and the Studio
#           is built to open it cross-origin. No package byte enters the site
#           artifact, so the site limit stops bounding the model.
#
# Either way this job verifies every resource's SHA-256 against the committed
# artifacts/ifc/digital-hub/build-report.json before publishing a site that
# points at it, so stale or mismatched bytes fail the deploy instead of being
# served silently.
#
# sixty5 (657 MB, CC-BY-4.0) is deliberately excluded from this demo.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/webgpu-spike/**"
      - "apps/demo-landing/**"
      - "packages/runtime-webgpu/**"
      - "packages/scene-ir/**"
      - "packages/workspace/**"
      - "packages/compiler/**"
      - "typedoc.json"
      - "docs/API_REFERENCE.md"
      - "artifacts/phase1/adafruit-pygamer/**"
      - "artifacts/ifc/digital-hub/build-report.json"
      - "scripts/check-public-demo.mjs"
      - ".github/workflows/deploy-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Studio demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the package delivery origin
        id: delivery
        env:
          PACKAGE_ORIGIN: ${{ vars.NARU_PACKAGE_ORIGIN }}
        run: |
          set -euo pipefail
          # publicDir has to exist either way; in delivery-origin mode it stays
          # empty, which is what keeps package bytes out of the site artifact.
          mkdir -p demo-scene/digital-hub
          if [ -z "${PACKAGE_ORIGIN}" ]; then
            echo "mode=site-artifact" >> "$GITHUB_OUTPUT"
            echo "document=" >> "$GITHUB_OUTPUT"
            echo "Digital Hub will be served from the Pages site artifact."
            exit 0
          fi
          case "${PACKAGE_ORIGIN}" in
            https://*) ;;
            *) echo "::error::NARU_PACKAGE_ORIGIN must be an https:// prefix"; exit 1 ;;
          esac
          origin="${PACKAGE_ORIGIN%/}/"
          echo "mode=delivery-origin" >> "$GITHUB_OUTPUT"
          echo "origin=${origin}" >> "$GITHUB_OUTPUT"
          echo "document=${origin}scene.gltf" >> "$GITHUB_OUTPUT"
          echo "Digital Hub will be served from ${origin}"

      - name: Download Digital Hub demo package
        if: steps.delivery.outputs.mode == 'site-artifact'
        run: |
          set -euo pipefail
          curl -fsSL -o digital-hub-demo-package.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/demo-digital-hub-v1/digital-hub-demo-package.tar.gz"
          tar -xzf digital-hub-demo-package.tar.gz -C demo-scene/digital-hub

      - name: Verify Digital Hub package against committed evidence
        if: steps.delivery.outputs.mode == 'site-artifact'
        run: |
          set -euo pipefail
          for f in scene.gltf scene.bin coarse.bin properties.json properties.bin; do
            expected=$(jq -r --arg p "$f" '.output.resources[] | select(.path == $p) | .sha256' \
              artifacts/ifc/digital-hub/build-report.json)
            actual=$(sha256sum "demo-scene/digital-hub/$f" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "::error::$f digest mismatch: expected $expected, got $actual"
              exit 1
            fi
          done

      - name: Verify the delivery origin against committed evidence
        if: steps.delivery.outputs.mode == 'delivery-origin'
        env:
          PACKAGE_ORIGIN: ${{ steps.delivery.outputs.origin }}
        run: |
          set -euo pipefail
          for f in scene.gltf scene.bin coarse.bin properties.json properties.bin; do
            expected=$(jq -r --arg p "$f" '.output.resources[] | select(.path == $p) | .sha256' \
              artifacts/ifc/digital-hub/build-report.json)
            # No -L, --max-redirs 0: the loader refuses redirects, so a deploy
            # that publishes a pointer to this origin has to refuse them too.
            actual=$(curl -fsS --max-redirs 0 "${PACKAGE_ORIGIN}${f}" | sha256sum | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "::error::$f digest mismatch at ${PACKAGE_ORIGIN}: expected $expected, got $actual"
              exit 1
            fi
          done

      - name: Build workspace dependencies
        run: pnpm --filter @naru3d/webgpu-spike^... run build

      - name: Build Studio (Digital Hub default scene)
        working-directory: apps/webgpu-spike
        env:
          NARU_SCENE_DIR: ${{ github.workspace }}/demo-scene/digital-hub
          # Empty in site-artifact mode, which the Studio reads as "not
          # configured" and resolves as ${BASE_URL}scene.gltf, exactly as before.
          VITE_NARU_DEFAULT_SCENE_URL: ${{ steps.delivery.outputs.document }}
        run: pnpm exec vite build --base=/naru/studio/

      - name: Build the API reference
        # TypeDoc over the four workspace packages; warnings fail the build
        # (typedoc.json sets treatWarningsAsErrors), so an undocumented export
        # never publishes silently.
        run: pnpm run docs:api

      - name: Assemble the site (landing page + Studio + API reference + evidence media)
        run: |
          set -euo pipefail
          mkdir -p site/media site/studio/pygamer site/api
          cp apps/demo-landing/index.html site/
          cp docs/media/naru-hero.svg docs/media/naru-mark-inverse.svg docs/media/naru-favicon.svg site/media/
          cp artifacts/browser-matrix/chrome-151-macos-selected.png site/media/step-picked.png
          cp artifacts/browser-matrix/chrome-151-macos-partial.png site/media/step-partial.png
          cp artifacts/browser-matrix/chrome-151-macos-view-priority.png site/media/step-priority.png
          cp artifacts/ifc/sixty5-first-frame/coarse-frame.png site/media/sixty5-coarse.png
          cp artifacts/ifc/sixty5-first-frame/budget-limited.png site/media/sixty5-budget.png
          cp artifacts/ifc/sixty5-first-frame/picked.png site/media/sixty5-picked.png
          cp artifacts/precision/large-coordinates/chrome-sectioned-far.png site/media/precision-far.png
          cp artifacts/spatial-demand/chrome-151-macos-spatial-demand.png site/media/spatial-demand.png
          cp -R apps/webgpu-spike/dist/. site/studio/
          cp -R output/api/. site/api/
          cp artifacts/phase1/adafruit-pygamer/scene.gltf site/studio/pygamer/
          cp artifacts/phase1/adafruit-pygamer/scene.bin site/studio/pygamer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Smoke-test deployed Studio and packages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PACKAGE_ORIGIN: ${{ vars.NARU_PACKAGE_ORIGIN }}
        run: |
          set -euo pipefail
          args=(--url "$PAGE_URL" --attempts 12 --retry-delay-ms 10000)
          if [ -n "${PACKAGE_ORIGIN}" ]; then
            args+=(--package-origin "${PACKAGE_ORIGIN%/}/")
          fi
          node scripts/check-public-demo.mjs "${args[@]}"
